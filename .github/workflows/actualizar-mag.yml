name: Actualizar MAG

on:
  push:
    paths-ignore:
      - "mag.json"
      - "mag_previous.json"
  schedule:
    # Actualización martes, miércoles y viernes cada hora de 11:00 a 18:00 de Argentina (14:00 a 21:00 UTC).
    # Así, si Guarino publica la rueda después de las 11:00, el MAG vuelve a intentarlo durante el día.
    - cron: "0 14-21 * * 2,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-mag
  cancel-in-progress: false

jobs:
  mag:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Sincronizar repositorio
        run: git pull --rebase origin main

      - name: Obtener precios e índices MAG
        run: python update_mag.py

      - name: Guardar resultado
        run: |
          git config user.name "Acción Rural MAG Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mag.json mag_previous.json
          if git diff --cached --quiet; then
            echo "Sin cambios en MAG."
            exit 0
          fi
          git commit -m "Actualizar datos MAG"
          git push origin HEAD:main
