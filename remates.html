<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acción Rural · Remates</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#5a1825;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.marquesina{width:100%;height:70px;overflow:hidden;background:#5a1825}.pista{height:70px;width:max-content;display:flex;align-items:stretch;animation:pasar 180s linear infinite}.evento{height:70px;display:flex;align-items:center;padding:0 22px;white-space:nowrap}.fecha{font-size:17px;font-weight:800;margin-right:15px}.lugar{font-size:14px;font-weight:700;margin-right:15px}.tipo{font-size:13px;margin-right:15px}.firma{font-size:13px;font-weight:800;color:#f2d36b}.sep{height:100%;width:2px;background:#c98b98;flex-shrink:0}@keyframes pasar{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media(max-width:600px){.marquesina,.pista,.evento{height:70px}.pista{animation-duration:155s}.evento{padding:0 13px}.fecha{font-size:14px;margin-right:10px}.lugar{font-size:11px;margin-right:10px}.tipo,.firma{font-size:10px;margin-right:10px}}</style></head><body><div class="marquesina"><div class="pista" id="pista"></div></div><script>const remates=[['01 SEP','Nogoyá','Haciendas Generales','Consignataria Hasenkamp'],['01 SEP','Colón','Reproductores – Cabaña Los Primos','Sáenz Valiente, Bullrich y Cía.'],['01 SEP','Feria María Dolores – General Ramírez','Haciendas Generales','Etchevehere Rural'],['02 SEP','Hasenkamp','Haciendas Generales','Consignataria Hasenkamp'],['02 SEP','San José de Urdinarrain','Reproductores – Limangus','Consignataria Spiazzi'],['02 SEP','Federal','Haciendas Generales','Etchevehere Rural'],['04 SEP','Rosario','Remate Habitual Rosgan','Ildarraz Hermanos'],['04 SEP','Feria María Dolores – General Ramírez','Cabaña Malaika','Etchevehere Rural'],['05 SEP','Gualeguay','Especial Faena – Expo Gualeguay','Consignataria Hasenkamp'],['05 SEP','Urdinarrain','R
