<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAG Cañuelas</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:92px;overflow:hidden}body{font-family:Arial,sans-serif;background:transparent;color:#fff}#mag-canuelas{width:100%;height:92px;overflow:hidden;position:relative;background:#173f60;color:#fff}.mag-fixed{position:absolute;z-index:5;left:0;top:0;width:100px;height:92px;background:#082f4a;border-right:1px solid rgba(255,255,255,.3);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:4px 8px}.mag-fixed strong{font-size:14px;line-height:17px;font-weight:700}.mag-fixed span{font-size:12px;line-height:15px;font-weight:700}.mag-fixed small{font-size:12px;line-height:15px;margin-top:1px;font-weight:700}.mag-fixed .mag-lugar{font-size:11px;line-height:14px;font-weight:700}.mag-window{position:absolute;left:100px;right:0;top:0;height:92px;overflow:hidden;cursor:grab;touch-action:pan-y}.mag-window.dragging{cursor:grabbing}.mag-track{display:flex;width:max-content;height:92px;align-items:stretch;will-change:transform}.mag-dato{width:285px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2px 6px}.mag-titulo{display:flex;justify-content:center;align-items:baseline;gap:6px;width:100%;margin-top:-5px;margin-bottom:5px;white-space:nowrap}.mag-categoria{font-size:16px;line-height:18px;font-weight:700}.mag-rango{font-size:16px;line-height:18px;font-weight:700}.mag-etiquetas{width:100%;display:grid;grid-template-columns:31% 31% 38%;align-items:center;text-align:center;margin-bottom:1px}.mag-etiquetas .corrientes{grid-column:1 / 3}.mag-etiquetas .maximo{grid-column:3}.mag-etiquetas span{font-size:10px;line-height:11px;font-weight:700}.mag-precios{width:100%;display:grid;grid-template-columns:31% 31% 38%;align-items:start;text-align:center}.mag-precio{display:flex;flex-direction:column;align-items:center;min-width:0}.mag-precio strong{font-size:14px;line-height:16px;white-space:nowrap}.mag-precio.max strong{font-size:15px}.mag-var{font-size:10px;line-height:11px;font-weight:700;min-height:11px;white-space:nowrap}.suba{color:#35d878}.baja{color:#ff5555}.igual{color:#d7d7d7}.sin-dato{color:#aab8c0}.mag-indices{width:430px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;padding:4px 8px}.mag-indices-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}.mag-indice{text-align:center;min-width:0}.mag-indice-nombre{display:block;font-size:10px;line-height:11px;font-weight:700;white-space:nowrap}.mag-indice-valor{display:block;font-size:15px;line-height:17px;font-weight:700;white-space:nowrap}.mag-indice-prom{font-size:8px;line-height:9px;white-space:nowrap}.mag-arrow{position:absolute;z-index:7;top:50%;transform:translateY(-50%);width:38px;height:52px;border:0;background:transparent;color:#fff;font-size:36px;line-height:48px;font-weight:400;cursor:pointer;padding:0;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.65);appearance:none}.mag-arrow.left{left:100px}.mag-arrow.right{right:2px}.mag-arrow:hover{background:transparent;color:#fff}@media(max-width:600px){html,body,#mag-canuelas{height:82px;min-height:82px;max-height:82px}.mag-fixed{width:80px;height:82px;top:0;bottom:auto;padding:3px 9px}.mag-fixed strong{font-size:12px;line-height:14px}.mag-fixed span{font-size:11px;line-height:13px}.mag-fixed small{font-size:11px;line-height:13px;margin-top:1px}.mag-fixed .mag-lugar{font-size:10px;line-height:12px}.mag-window{left:80px;height:82px;top:0;background:#173f60}.mag-track{height:82px}.mag-dato{width:245px;height:82px}.mag-titulo{gap:4px;margin-top:-4px;margin-bottom:3px}.mag-categoria{font-size:14px;line-height:15px}.mag-rango{font-size:14px;line-height:15px}.mag-etiquetas span{font-size:8px;line-height:9px}.mag-precio strong{font-size:11px;line-height:13px}.mag-precio.max strong{font-size:12px}.mag-var{font-size:8.8px;line-height:10px;min-height:10px}.mag-indices{width:300px;height:82px;padding:3px 4px}.mag-indices-grid{gap:2px}.mag-indice-nombre{font-size:8px;line-height:9px}.mag-indice-valor{font-size:12px;line-height:14px}.mag-indice-prom{font-size:7px;line-height:8px}.mag-arrow{width:30px;height:40px;font-size:30px;line-height:36px}.mag-arrow.left{left:80px}.mag-arrow.right{right:0}}</style></head><body><div id="mag-canuelas"><div class="mag-fixed"><strong>MAG</strong><div class="mag-lugar">Cañuelas</div><span id="mag-date">—</span><small id="mag-heads">— Cab.</small></div><div class="mag-window" id="mag-window"><div class="mag-track" id="mag-track"></div></div><button class="mag-arrow left" id="mag-left" aria-label="Anterior">‹</button><button class="mag-arrow right" id="mag-right" aria-label="Siguiente">›</button></div><script>const C={novillos_431_460:['NOV.','431/460 Kg.'],novillos_461_490:['NOV.','461/490 Kg.'],novillos_491_520:['NOV.','491/520 Kg.'],novillos_mas_520:['NOV.','+520 Kg.'],novillos_regulares:['NOV.','REG.'],novillitos_300_350:['NTOS.','300/350 Kg.'],novillitos_351_390:['NTOS.','351/390 Kg.'],novillitos_391_430:['NTOS.','391/430 Kg.'],novillitos_regulares:['NTOS.','REG.'],vaquillonas_300_350:['VAQ.','300/350 Kg.'],vaquillonas_351_390:['VAQ.','351/390 Kg.'],vaquillonas_391_430:['VAQ.','391/430 Kg.'],vaquillonas_regulares:['VAQ.','REG.'],vacas_buenas_especiales:['VAC.','BUE/ESP'],vacas_regulares:['VAC.','REG.'],conserva_buena:['CONS.','BUENA'],conserva_inferior:['CONS.','INFERIOR'],toros_buenos_especiales:['TOR.','BUE/ESP'],toros_regulares:['TOR.','REG.']};const money=n=>n==null?'—':'$'+Number(n).toLocaleString('es-AR');const pct=n=>n==null?'—':(n>0?'▲ ':'')+(n<0?'▼ ':'')+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';function cls(n){return n==null?'sin-dato':n>0?'suba':n<0?'baja':'igual'}function dato(k,d){const c=C[k],v=d.prices?.[k]||{},ch=v.changes||{};return `<div class="mag-dato"><div class="mag-titulo"><span class="mag-categoria">${c[0]}</span><span class="mag-rango">${c[1]}</span></div><div class="mag-etiquetas"><span class="corrientes">CORRIENTES</span><span class="maximo">MÁXIMO</span></div><div class="mag-precios"><div class="mag-precio"><strong>${money(v.min_corriente)}</strong><span class="mag-var ${cls(ch.min_corriente)}">${pct(ch.min_corriente)}</span></div><div class="mag-precio"><strong>${money(v.max_corriente)}</strong><span class="mag-var ${cls(ch.max_corriente)}">${pct(ch.max_corriente)}</span></div><div class="mag-precio max"><strong>${money(v.maximo)}</strong><span class="mag-var ${cls(ch.maximo)}">${pct(ch.maximo)}</span></div></div></div>`}function indices(d){const x=d.indices||{};const item=(nombre,valor)=>`<div class="mag-indice"><span class="mag-indice-valor">${Number(valor||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</span><span class="mag-indice-nombre">${nombre}</span></div>`;return `<div class="mag-indices"><div class="mag-indices-grid">${item('IND. NOV.',x.inmag_novillo)}${item('IND. GRAL.',x.igmag_general)}${item('IND. ARREND.',x.arrendamiento)}</div></div>`}async function load(){const url='https://acciondelarroque-creator.github.io/accion-rural-mag/mag.json?t='+Date.now();const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('MAG HTTP '+response.status);const d=await response.json();document.getElementById('mag-date').textContent=d.date||'—';document.getElementById('mag-heads').textContent=(d.heads!=null?Number(d.heads).toLocaleString('es-AR'):'—')+' Cab.';let html='';for(const k of Object.keys(C))if(d.prices?.[k])html+=dato(k,d);html+=indices(d);html+=`<div class="mag-indices" style="width:300px;justify-content:center"><div class="mag-indice-prom" style="font-size:10px;line-height:12px;text-align:center">Fuente: ${d.source||'Grupo Guarino · Mercado Agroganadero de Cañuelas (MAG)'}</div></div>`;document.getElementById('mag-track').innerHTML=html;init()}function init(){const win=document.getElementById('mag-window'),track=document.getElementById('mag-track'),left=document.getElementById('mag-left'),right=document.getElementById('mag-right');let x=0,max=0,drag=false,start=0,startX=0,lastTime=performance.now();function bounds(){max=Math.max(0,track.scrollWidth-win.clientWidth);x=Math.max(-max,Math.min(0,x));track.style.transform=`translate3d(${x}px,0,0)`}function move(n){x=Math.max(-max,Math.min(0,x+n));track.style.transform=`translate3d(${x}px,0,0)`}left.onclick=()=>move(220);right.onclick=()=>move(-220);win.addEventListener('pointerdown',e=>{drag=true;start=e.clientX;startX=x;win.classList.add('dragging');if(win.setPointerCapture)win.setPointerCapture(e.pointerId)});win.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-start;x=Math.max(-max,Math.min(0,startX+dx));track.style.transform=`translate3d(${x}px,0,0)`;if(Math.abs(dx)>3&&e.cancelable)e.preventDefault()});function soltar(){drag=false;win.classList.remove('dragging')}win.addEventListener('pointerup',soltar);win.addEventListener('pointercancel',soltar);win.addEventListener('lostpointercapture',soltar);function auto(t){if(!drag&&max>0){const dt=Math.min(50,t-lastTime);x-=0.32*(dt/16.67);if(x<=-max)x=0;track.style.transform=`translate3d(${x}px,0,0)`}lastTime=t;requestAnimationFrame(auto)}window.addEventListener('resize',bounds);bounds();requestAnimationFrame(auto)}load().catch(e=>{console.error('MAG:',e);document.getElementById('mag-canuelas').innerHTML='<div style="padding:20px;font-family:Arial">No se pudieron cargar los datos MAG.</div>'});</script></body></html>
