<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acción Rural · Mercado Agroganadero de Cañuelas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#173f60;font-family:Arial,Helvetica,sans-serif}.mag-wrap{width:100%;max-width:1180px;margin:0 auto}.mag-portada{width:100%;overflow:hidden;background:#173f60;border-radius:8px 8px 0 0}.mag-portada img{display:block;width:100%;height:auto}.jornada{padding:9px 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:16px;color:#173f60}.jornada strong{font-weight:700}.resumen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.resumen-box{background:#173f60;color:#fff;padding:12px 16px;text-align:center;border-radius:4px}.resumen-box strong{display:block;font-size:22px;line-height:26px}.resumen-box span{font-size:12px}.grupo{margin:0 0 14px;border:1px solid #d7dde2;border-radius:5px;overflow:hidden}.grupo-titulo{background:#173f60;color:#fff;padding:9px 14px;font-weight:800;font-size:15px;letter-spacing:.5px}.tabla{width:100%;border-collapse:collapse}.tabla th{background:#eef2f5;color:#173f60;font-size:11px;padding:8px 6px;text-align:center;border-bottom:1px solid #d7dde2}.tabla td{padding:8px 6px;border-bottom:1px solid #e3e7ea;text-align:center;font-size:13px}.tabla tr:last-child td{border-bottom:0}.tabla td:first-child{text-align:left;font-weight:700}.precio{font-weight:700;white-space:nowrap}.var{font-size:11px;font-weight:700;display:block;margin-top:2px}.suba{color:#168548}.baja{color:#c62e2e}.igual{color:#777}.sin{color:#aaa}.indices{margin:18px 0;border:1px solid #d7dde2;border-radius:5px;overflow:hidden}.indices-titulo{background:#b58a3a;color:#fff;padding:9px 14px;font-weight:800;font-size:15px}.indices-grid{display:grid;grid-template-columns:repeat(3,1fr)}.indice{padding:14px 10px;text-align:center;border-right:1px solid #ddd}.indice:last-child{border-right:0}.indice strong{display:block;font-size:22px}.indice span{display:block;font-size:11px;margin-top:3px}.indice .prom{margin-top:8px;color:#666}.estado{margin:18px 0 8px;padding:15px 18px;background:#f4f6f7;border-left:5px solid #b58a3a}.estado h3{margin:0 0 7px;font-size:14px;letter-spacing:.7px}.estado p{margin:0;color:#333;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.45}.fuente{margin:10px 0 20px;color:#777;font-size:11px;line-height:16px}@media(max-width:600px){.jornada{font-size:14px}.resumen-box{padding:10px 8px}.resumen-box strong{font-size:18px}.tabla th{font-size:9px;padding:7px 3px}.tabla td{font-size:11px;padding:7px 3px}.tabla td:first-child{font-size:10px}.var{font-size:9px}.indices-grid{grid-template-columns:1fr}.indice{border-right:0;border-bottom:1px solid #ddd}.indice:last-child{border-bottom:0}.estado p{font-size:14px}}
</style>
</head>
<body>
<div class="mag-wrap">
<div class="mag-portada"><img src="https://accionrural.com.ar/download/multimedia.grande.9ba54a7cb55dc977.Z3JhbmRlLndlYnA%3D.webp" alt="Mercado Agroganadero de Cañuelas"></div>
<div class="jornada">Jornada: <strong id="fecha">Cargando...</strong></div>
<div class="resumen"><div class="resumen-box"><strong id="cabezas">—</strong><span>Cabezas ingresadas</span></div><div class="resumen-box"><strong id="camiones">—</strong><span>Camiones</span></div></div>
<div id="planilla">Cargando datos del MAG...</div>
<div class="indices"><div class="indices-titulo">Índices MAG</div><div class="indices-grid" id="indices-grid"></div></div>
<section class="estado"><h3>ESTADO DE LA PLAZA</h3><p id="estado">Analizando el comportamiento de la jornada...</p></section>
<div class="fuente">Fuente: Grupo Guarino. Los valores corresponden a la información disponible para el Mercado Agroganadero de Cañuelas (MAG).</div>
</div>
<script>
const C={"Novillos":["novillos_431_460","novillos_461_490","novillos_491_520","novillos_mas_520","novillos_regulares"],"Novillitos":["novillitos_300_350","novillitos_351_390","novillitos_391_430","novillitos_regulares"],"Vaquillonas":["vaquillonas_300_350","vaquillonas_351_390","vaquillonas_391_430","vaquillonas_regulares"],"Vacas y conserva":["vacas_buenas_especiales","vacas_regulares","conserva_buena","conserva_inferior"],"Toros":["toros_buenos_especiales","toros_regulares"]};
const N={novillos_431_460:"Novillos 431/460 kg",novillos_461_490:"Novillos 461/490 kg",novillos_491_520:"Novillos 491/520 kg",novillos_mas_520:"Novillos +520 kg",novillos_regulares:"Novillos regulares",novillitos_300_350:"Novillitos 300/350 kg",novillitos_351_390:"Novillitos 351/390 kg",novillitos_391_430:"Novillitos 391/430 kg",novillitos_regulares:"Novillitos regulares",vaquillonas_300_350:"Vaquillonas 300/350 kg",vaquillonas_351_390:"Vaquillonas 351/390 kg",vaquillonas_391_430:"Vaquillonas 391/430 kg",vaquillonas_regulares:"Vaquillonas regulares",vacas_buenas_especiales:"Vacas buenas a especiales",vacas_regulares:"Vacas regulares",conserva_buena:"Conserva buena",conserva_inferior:"Conserva inferior",toros_buenos_especiales:"Toros buenos a especiales",toros_regulares:"Toros regulares"};
const money=n=>n==null?'—':'$'+Number(n).toLocaleString('es-AR');
const pct=n=>n==null?'—':(n>0?'▲ ':n<0?'▼ ':'')+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const cls=n=>n==null?'sin':n>0?'suba':n<0?'baja':'igual';
function celda(n,ch){return `<td><span class="precio">${money(n)}</span><span class="var ${cls(ch)}">${pct(ch)}</span></td>`}
function tablaGrupo(nombre,keys,d){let h=`<section class="grupo"><div class="grupo-titulo">${nombre}</div><table class="tabla"><thead><tr><th style="text-align:left">Categoría</th><th>Corriente mín.</th><th>Corriente máx.</th><th>Máximo</th></tr></thead><tbody>`;for(const k of keys){const v=d.prices?.[k]||{},c=v.changes||{};h+=`<tr><td>${N[k]}</td>${celda(v.min_corriente,c.min_corriente)}${celda(v.max_corriente,c.max_corriente)}${celda(v.maximo,c.maximo)}</tr>`}return h+'</tbody></table></section>'}
function indice(nombre,valor,varia,prom){return `<div class="indice"><strong>${Number(valor||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</strong><span>${nombre} · <b class="${cls(varia)}">${pct(varia)}</b></span>${prom?`<span class="prom">Promedio ${prom.mes}: ${Number(prom.promedio).toLocaleString('es-AR',{minimumFractionDigits:3})} · ${pct(prom.variacion)}</span>`:''}</div>`}
function promedioCat(v){const a=Object.values(v?.changes||{}).filter(x=>typeof x==='number');return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function estado(d){const vals=Object.values(d.prices||{}).map(promedioCat).filter(x=>x!==null);const avg=vals.length?vals.reduce((s,x)=>s+x,0)/vals.length:0;const fuertes=Object.entries(d.prices||{}).filter(([k,v])=>(promedioCat(v)||0)>=2).map(([k])=>N[k]);const bajas=Object.entries(d.prices||{}).filter(([k,v])=>(promedioCat(v)||0)<=-2).map(([k])=>N[k]);let t=avg>=1.5?'La jornada muestra una plaza firme, con predominio de mejoras en distintas categorías.':avg<=-1.5?'La jornada presenta una plaza floja y selectiva, con predominio de bajas.':'La jornada presenta un comportamiento mixto y selectivo, con diferencias según categoría y calidad.';if(fuertes.length)t+=` Se destacan por sus mejoras ${fuertes.slice(0,3).join(', ')}${fuertes.length>3?' y otras categorías':''}.`;if(bajas.length)t+=` Se observan bajas en ${bajas.slice(0,3).join(', ')}${bajas.length>3?' y otras categorías':''}.`;const ic=Object.values(d.indices_changes||{}).filter(x=>typeof x==='number');if(ic.filter(x=>x<-1).length>=2)t+=' Los índices de referencia también registran una evolución negativa en la jornada.';else if(ic.filter(x=>x>1).length>=2)t+=' Los índices de referencia acompañan con una evolución positiva.';return t}
async function cargar(){try{const r=await fetch('./mag.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.getElementById('fecha').textContent=d.date||'Sin fecha';document.getElementById('cabezas').textContent=Number(d.heads||0).toLocaleString('es-AR');document.getElementById('camiones').textContent=d.trucks??'—';let html='';for(const[g,keys]of Object.entries(C))html+=tablaGrupo(g,keys,d);document.getElementById('planilla').innerHTML=html;const x=d.indices||{},ch=d.indices_changes||{},m=d.indices_monthly||{};document.getElementById('indices-grid').innerHTML=indice('INMAG Novillo',x.inmag_novillo,ch.inmag_novillo,m.inmag_novillo)+indice('IGMAG General',x.igmag_general,ch.igmag_general,m.igmag_general)+indice('Arrendamiento',x.arrendamiento,ch.arrendamiento,m.arrendamiento);document.getElementById('estado').textContent=estado(d)}catch(e){console.error(e);document.getElementById('fecha').textContent='Sin datos';document.getElementById('planilla').innerHTML='<div style="padding:18px;background:#f8eeee;color:#a22">No se pudieron cargar los datos del MAG.</div>';document.getElementById('estado').textContent='No fue posible cargar los datos de la jornada.'}}
cargar();
</script>
</body>
</html>
