<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acción Rural · MAG Cañuelas</title><style>body{margin:0;background:#173f60;color:#fff;font-family:Georgia,"Times New Roman",serif}#mag{width:100%;height:100vh;overflow:hidden;position:relative}.track{display:flex;width:max-content;height:92px;align-items:stretch;animation:scroll 82s linear infinite}.track:hover{animation-play-state:paused}.header{width:215px;height:92px;flex-shrink:0;background:#10466a;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4px 10px}.header strong{font-size:18px;line-height:21px}.header span{font-size:12px;line-height:15px;font-weight:bold}.header small{font-family:Arial,sans-serif;font-size:9px;line-height:11px}.summary{width:105px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.summary strong{font-size:19px;line-height:22px}.summary span{font:10px/13px Arial,sans-serif}.dato{width:330px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2px 8px;box-sizing:border-box}.titulo{display:flex;justify-content:center;align-items:baseline;gap:7px;width:100%;margin:-5px 0 5px;white-space:nowrap}.cat{font-size:15px;line-height:18px;font-weight:bold}.rango{font-size:17px;line-height:19px;font-weight:bold}.labels,.prices{width:100%;display:grid;grid-template-columns:31% 31% 38%;align-items:center;text-align:center}.labels{font:10px/11px Arial,sans-serif;font-weight:bold;margin-bottom:1px}.prices{align-items:start}.prices strong{font-size:14px;line-height:16px;white-space:nowrap}.prices .max strong{font-size:15px;font-weight:bold}.var{font:10px/11px Arial,sans-serif;font-weight:bold;min-height:11px;white-space:nowrap}.up{color:#35d878}.down{color:#ff5555}.eq{color:#d7d7d7}.none{color:#aab8c0}.indices{width:760px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:4px 10px}.indices-title{text-align:center;font:10px/11px Arial,sans-serif;font-weight:bold;margin-bottom:3px}.indices-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}.iname{display:block;font:9px/10px Arial,sans-serif;font-weight:bold;white-space:nowrap}.ival{font-size:15px;line-height:17px;font-weight:bold;white-space:nowrap}.ivar{font:9px/10px Arial,sans-serif;font-weight:bold}.iprom{display:block;font:8px/9px Arial,sans-serif;white-space:nowrap}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media(max-width:600px){.track{height:78px;animation-duration:68s}.header{width:175px;height:78px}.header strong{font-size:14px}.header span{font-size:10px}.header small{font-size:8px;line-height:9px}.summary{width:82px;height:78px}.summary strong{font-size:15px}.summary span{font-size:8px}.dato{width:300px;height:78px;padding:2px 5px}.titulo{gap:5px;margin:-4px 0 4px}.cat{font-size:12px;line-height:15px}.rango{font-size:15px;line-height:16px}.labels{font-size:8px;line-height:9px}.prices strong{font-size:11px;line-height:13px}.prices .max strong{font-size:12px}.var{font-size:8px;line-height:9px;min-height:9px}.indices{width:760px;height:78px;padding:3px 6px}.indices-title{font-size:8px;line-height:9px;margin-bottom:2px}.indices-grid{gap:5px}.iname{font-size:7px;line-height:8px}.ival{font-size:12px;line-height:14px}.ivar{font-size:7px;line-height:8px}.iprom{font-size:6px;line-height:7px}}</style></head><body><div id="mag"><div id="track" class="track"></div></div><script>
const C={novillos_431_460:['NOVILLOS','431/460 Kg.'],novillos_461_490:['NOVILLOS','461/490 Kg.'],novillos_491_520:['NOVILLOS','491/520 Kg.'],novillos_mas_520:['NOVILLOS','+520 Kg.'],novillos_regulares:['NOVILLOS','Regulares'],novillitos_300_350:['NOVILLITOS','300/350 Kg.'],novillitos_351_390:['NOVILLITOS','351/390 Kg.'],novillitos_391_430:['NOVILLITOS','391/430 Kg.'],novillitos_regulares:['NOVILLITOS','Regulares'],vaquillonas_300_350:['VAQUILLONAS','300/350 Kg.'],vaquillonas_351_390:['VAQUILLONAS','351/390 Kg.'],vaquillonas_391_430:['VAQUILLONAS','391/430 Kg.'],vaquillonas_regulares:['VAQUILLONAS','Regulares'],vacas_buenas_especiales:['VACAS','Buenas a especiales'],vacas_regulares:['VACAS','Regulares'],conserva_buena:['CONSERVA','Buena'],conserva_inferior:['CONSERVA','Inferior'],toros_buenos_especiales:['TOROS','Buenos a especiales'],toros_regulares:['TOROS','Regulares']};
const fmt=n=>n==null?'—':'$'+Number(n).toLocaleString('es-AR');
const variation=(v)=>{if(v==null||v==='—')return '<span class="var none">—</span>';let s=String(v), cls=s.includes('▼')?'down':s.includes('▲')?'up':'eq';return '<span class="var '+cls+'">'+s+'</span>'};
function dato(k,d){let c=C[k]||[k,''],v=d.values?.[k];let a=Array.isArray(v)?v:[null,null,v];let ch=d.changes?.[k];let vars=Array.isArray(ch)?ch:[null,null,null];return `<div class="dato"><div class="titulo"><span class="cat">${c[0]}</span><span class="rango">${c[1]}</span></div><div class="labels"><span>CORRIENTES</span><span>PROMEDIO</span><span>MÁXIMO</span></div><div class="prices"><div><strong>${fmt(a[0])}</strong>${variation(vars[0])}</div><div><strong>${fmt(a[1])}</strong>${variation(vars[1])}</div><div class="max"><strong>${fmt(a[2])}</strong>${variation(vars[2])}</div></div></div>`}
function indices(d){let x=d.indices||{},c=d.indices_changes||{},p=d.indices_monthly||{};return `<div class="indices"><div class="indices-title">ÍNDICES MERCADO AGROGANADERO DE CAÑUELAS (MAG) · ÚLTIMO ÍNDICE OPERADO ${d.date||''}</div><div class="indices-grid"><div><span class="iname">INMAG · NOVILLO</span><span class="ival">${Number(x.inmag_novillo||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</span> ${variation(c.inmag_novillo?('▲ '+c.inmag_novillo+'%'):null)}<span class="iprom">${p.inmag_novillo||''}</span></div><div><span class="iname">IGMAG · GENERAL</span><span class="ival">${Number(x.igmag_general||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</span> ${variation(c.igmag_general?('▲ '+c.igmag_general+'%'):null)}<span class="iprom">${p.igmag_general||''}</span></div><div><span class="iname">ÍNDICE SUGERIDO ARRENDAMIENTOS RURALES</span><span class="ival">${Number(x.arrendamiento||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</span> ${variation(c.arrendamiento?('▲ '+c.arrendamiento+'%'):null)}<span class="iprom">${p.arrendamiento||''}</span></div></div></div>`}
async function load(){let d=await fetch('mag.json?'+Date.now()).then(r=>r.json());let html=`<div class="header"><strong>MAG CAÑUELAS</strong><span>${d.date||''}</span><small>Fuente: Grupo Guarino</small></div><div class="summary"><strong>${Number(d.heads||0).toLocaleString('es-AR')}</strong><span>Entrada · cabezas</span></div><div class="summary"><strong>${d.trucks??'—'}</strong><span>Camiones</span></div>`;for(const k of Object.keys(C))html+=dato(k,d);html+=indices(d);document.getElementById('track').innerHTML=html+html}load().catch(e=>document.getElementById('mag').innerHTML='<div style="padding:20px;font-family:Arial">No se pudieron cargar los datos MAG.</div>');
</script></body></html>
