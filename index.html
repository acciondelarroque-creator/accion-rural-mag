<title>Acción Rural · Mercado Agroganadero de Cañuelas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#173f60;font-family:Arial,Helvetica,sans-serif}.mag-portada{width:100%;position:relative;overflow:hidden;background:#173f60}.mag-portada img{display:block;width:100%;height:auto}.mag-fecha{position:absolute;left:28%;bottom:12%;padding:5px 14px;background:rgba(23,63,96,.94);color:#fff;border-radius:3px;font-size:clamp(12px,1.35vw,20px);line-height:1.2;font-weight:700;letter-spacing:.4px;white-space:nowrap}.mag-fecha span{font-weight:400;margin-right:5px}#mag-canuelas{width:100%;height:92px;overflow:hidden;position:relative;background:#173f60;color:#fff;font-family:Georgia,"Times New Roman",serif}#mag-canuelas .mag-track{display:flex;width:max-content;height:92px;align-items:stretch;animation:mag-scroll 82s linear infinite}#mag-canuelas:hover .mag-track{animation-play-state:paused}#mag-canuelas .mag-header{width:215px;height:92px;flex-shrink:0;background:#10466a;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4px 10px}#mag-canuelas .mag-header strong{font-size:18px;line-height:21px}#mag-canuelas .mag-header span{font-size:12px;line-height:15px;font-weight:bold}#mag-canuelas .mag-header small{font-family:Arial,sans-serif;font-size:9px;line-height:11px;margin-top:1px}#mag-canuelas .mag-resumen{width:105px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}#mag-canuelas .mag-resumen strong{font-size:19px;line-height:22px}#mag-canuelas .mag-resumen span{font-size:10px;line-height:13px}#mag-canuelas .mag-dato{width:285px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2px 6px}#mag-canuelas .mag-titulo{display:flex;justify-content:center;align-items:baseline;gap:6px;width:100%;margin-top:-5px;margin-bottom:5px;white-space:nowrap}#mag-canuelas .mag-categoria{font-size:14px;line-height:17px;font-weight:bold}#mag-canuelas .mag-rango{font-size:16px;line-height:18px;font-weight:bold}#mag-canuelas .mag-etiquetas{width:100%;display:grid;grid-template-columns:31% 31% 38%;align-items:center;text-align:center;margin-bottom:1px}#mag-canuelas .mag-etiquetas .corrientes{grid-column:1 / 3}#mag-canuelas .mag-etiquetas .maximo{grid-column:3}#mag-canuelas .mag-etiquetas span{font-family:Arial,sans-serif;font-size:10px;line-height:11px;font-weight:bold}#mag-canuelas .mag-precios{width:100%;display:grid;grid-template-columns:31% 31% 38%;align-items:start;text-align:center}#mag-canuelas .mag-precio{display:flex;flex-direction:column;align-items:center;min-width:0}#mag-canuelas .mag-precio strong{font-size:14px;line-height:16px;white-space:nowrap}#mag-canuelas .mag-precio.max strong{font-size:15px}#mag-canuelas .mag-var{font-family:Arial,sans-serif;font-size:10px;line-height:11px;font-weight:bold;min-height:11px;white-space:nowrap}#mag-canuelas .suba{color:#35d878}#mag-canuelas .baja{color:#ff5555}#mag-canuelas .igual{color:#d7d7d7}#mag-canuelas .sin-dato{color:#aab8c0}#mag-canuelas .mag-indices{width:650px;height:92px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:4px 10px}#mag-canuelas .mag-indices-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}#mag-canuelas .mag-indice{text-align:center;min-width:0}#mag-canuelas .mag-indice-nombre{display:block;font-family:Arial,sans-serif;font-size:10px;line-height:11px;font-weight:bold;white-space:nowrap}#mag-canuelas .mag-indice-valor{display:block;font-size:15px;line-height:17px;font-weight:bold;white-space:nowrap}#mag-canuelas .mag-indice-var{font-family:Arial,sans-serif;font-size:9px;line-height:10px;font-weight:bold}#mag-canuelas .mag-indice-prom{display:block;font-family:Arial,sans-serif;font-size:8px;line-height:9px;white-space:nowrap}@keyframes mag-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}.estado-plaza{width:100%;max-width:1100px;margin:18px auto 0;padding:16px 20px 17px;border-left:5px solid #b58a3a;background:#f5f7f8}.estado-titulo{margin:0 0 7px;color:#173f60;font-size:14px;line-height:18px;font-weight:800;letter-spacing:.8px}.estado-plaza p{margin:0;color:#333;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.45}.estado-fuente{width:100%;max-width:1100px;margin:8px auto 20px;padding:0 20px;color:#777;font-size:11px;line-height:16px}@media(max-width:600px){.mag-fecha{left:27%;bottom:10%;padding:3px 8px;font-size:11px}#mag-canuelas{height:78px}#mag-canuelas .mag-track{height:78px;animation-duration:68s}#mag-canuelas .mag-header{width:175px;height:78px}#mag-canuelas .mag-header strong{font-size:14px;line-height:17px}#mag-canuelas .mag-header span{font-size:10px;line-height:12px}#mag-canuelas .mag-header small{font-size:8px;line-height:9px}#mag-canuelas .mag-resumen{width:82px;height:78px}#mag-canuelas .mag-resumen strong{font-size:15px}#mag-canuelas .mag-resumen span{font-size:8px}#mag-canuelas .mag-dato{width:265px;height:78px;padding:2px 5px}#mag-canuelas .mag-titulo{gap:5px;margin-top:-4px;margin-bottom:4px}#mag-canuelas .mag-categoria{font-size:11px;line-height:14px}#mag-canuelas .mag-rango{font-size:14px;line-height:15px}#mag-canuelas .mag-etiquetas span{font-size:8px;line-height:9px}#mag-canuelas .mag-precio strong{font-size:11px;line-height:13px}#mag-canuelas .mag-precio.max strong{font-size:12px}#mag-canuelas .mag-var{font-size:8px;line-height:9px;min-height:9px}#mag-canuelas .mag-indices{width:650px;height:78px;padding:3px 6px}#mag-canuelas .mag-indice-nombre{font-size:8px;line-height:9px}#mag-canuelas .mag-indice-valor{font-size:12px;line-height:14px}#mag-canuelas .mag-indice-var{font-size:7px;line-height:8px}#mag-canuelas .mag-indice-prom{font-size:6px;line-height:7px}.estado-plaza{margin-top:12px;padding:13px 14px 14px;border-left-width:4px}.estado-titulo{font-size:12px;line-height:15px}.estado-plaza p{font-size:14px;line-height:1.42}.estado-fuente{padding:0 14px;font-size:10px}}
</style>
</head>
<body>
<div class="mag-portada"><img src="https://accionrural.com.ar/download/multimedia.grande.9ba54a7cb55dc977.Z3JhbmRlLndlYnA%3D.webp" alt="Mercado Agroganadero de Cañuelas"><div class="mag-fecha"><span>Jornada:</span><strong id="fecha-mag">Cargando...</strong></div></div>
<div id="mag-canuelas"><div class="mag-track" id="mag-track"></div></div>
<section class="estado-plaza"><div class="estado-titulo">ESTADO DE LA PLAZA</div><p id="estado-plaza-texto">Analizando el comportamiento de la jornada...</p></section>
<div class="estado-fuente">Fuente: Grupo Guarino. Los valores corresponden a la información disponible para el Mercado Agroganadero de Cañuelas (MAG).</div>
<script>
const MAG_JSON='https://raw.githubusercontent.com/acciondelarroque-creator/accion-rural-mag/main/mag.json';
const C={novillos_431_460:['NOV.','431/460 Kg.'],novillos_461_490:['NOV.','461/490 Kg.'],novillos_491_520:['NOV.','491/520 Kg.'],novillos_mas_520:['NOV.','+520 Kg.'],novillos_regulares:['NOV.','REG.'],novillitos_300_350:['NTOS.','300/350 Kg.'],novillitos_351_390:['NTOS.','351/390 Kg.'],novillitos_391_430:['NTOS.','391/430 Kg.'],novillitos_regulares:['NTOS.','REG.'],vaquillonas_300_350:['VAQ.','300/350 Kg.'],vaquillonas_351_390:['VAQ.','351/390 Kg.'],vaquillonas_391_430:['VAQ.','391/430 Kg.'],vaquillonas_regulares:['VAQ.','REG.'],vacas_buenas_especiales:['VAC.','BUE/ESP'],vacas_regulares:['VAC.','REG.'],conserva_buena:['CONS.','BUENA'],conserva_inferior:['CONS.','INFERIOR'],toros_buenos_especiales:['TOR.','BUE/ESP'],toros_regulares:['TOR.','REG.']};
const GRUPOS={novillos:['novillos_431_460','novillos_461_490','novillos_491_520','novillos_mas_520','novillos_regulares'],novillitos:['novillitos_300_350','novillitos_351_390','novillitos_391_430','novillitos_regulares'],vaquillonas:['vaquillonas_300_350','vaquillonas_351_390','vaquillonas_391_430','vaquillonas_regulares'],vacas:['vacas_buenas_especiales','vacas_regulares','conserva_buena','conserva_inferior'],toros:['toros_buenos_especiales','toros_regulares']};
const money=n=>n==null?'—':'$'+Number(n).toLocaleString('es-AR');
const pct=n=>n==null?'—':(n>0?'▲ ':n<0?'▼ ':'')+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
function cls(n){return n==null?'sin-dato':n>0?'suba':n<0?'baja':'igual'}
function dato(k,d){const c=C[k],v=d.prices?.[k]||{},ch=v.changes||{};return `<div class="mag-dato"><div class="mag-titulo"><span class="mag-categoria">${c[0]}</span><span class="mag-rango">${c[1]}</span></div><div class="mag-etiquetas"><span class="corrientes">CORRIENTES</span><span class="maximo">MÁXIMO</span></div><div class="mag-precios"><div class="mag-precio"><strong>${money(v.min_corriente)}</strong><span class="mag-var ${cls(ch.min_corriente)}">${pct(ch.min_corriente)}</span></div><div class="mag-precio"><strong>${money(v.max_corriente)}</strong><span class="mag-var ${cls(ch.max_corriente)}">${pct(ch.max_corriente)}</span></div><div class="mag-precio max"><strong>${money(v.maximo)}</strong><span class="mag-var ${cls(ch.maximo)}">${pct(ch.maximo)}</span></div></div></div>`}
function indices(d){const x=d.indices||{},c=d.indices_changes||{},p=d.indices_monthly||{};return `<div class="mag-indices"><div class="mag-indices-grid"><div class="mag-indice"><span class="mag-indice-valor">${Number(x.inmag_novillo||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</span><span class="mag-indice-nombre">IND. NOV.</span><span class="mag-indice-var ${cls(c.inmag_novillo)}">${pct(c.inmag_novillo)}</span><span class="mag-indice-prom">${p.inmag_novillo?`Prom. mensual: ${Number(p.inmag_novillo.promedio).toLocaleString('es-AR',{minimumFractionDigits:3})} · ${pct(p.inmag_novillo.variacion)}`:''}</span></div><div class="mag-indice"><span class="mag-indice-valor">${Number(x.igmag_general||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</span><span class="mag-indice-nombre">IND. GRAL.</span><span class="mag-indice-var ${cls(c.igmag_general)}">${pct(c.igmag_general)}</span><span class="mag-indice-prom">${p.igmag_general?`Prom. mensual: ${Number(p.igmag_general.promedio).toLocaleString('es-AR',{minimumFractionDigits:3})} · ${pct(p.igmag_general.variacion)}`:''}</span></div><div class="mag-indice"><span class="mag-indice-valor">${Number(x.arrendamiento||0).toLocaleString('es-AR',{minimumFractionDigits:3})}</span><span class="mag-indice-nombre">IND. ARREND.</span><span class="mag-indice-var ${cls(c.arrendamiento)}">${pct(c.arrendamiento)}</span><span class="mag-indice-prom">${p.arrendamiento?`Prom. mensual: ${Number(p.arrendamiento.promedio).toLocaleString('es-AR',{minimumFractionDigits:3})} · ${pct(p.arrendamiento.variacion)}`:''}</span></div></div></div>`}
function variacionCategoria(v){const ch=v?.changes||{},valores=Object.values(ch).filter(x=>typeof x==='number');return valores.length?valores.reduce((a,b)=>a+b,0)/valores.length:null}
function analizarGrupo(d,keys){const r=keys.map(k=>variacionCategoria(d.prices?.[k])).filter(x=>typeof x==='number');if(!r.length)return{prom:null,firmes:0,bajas:0,estables:0};return{prom:r.reduce((a,b)=>a+b,0)/r.length,firmes:r.filter(x=>x>=2).length,bajas:r.filter(x=>x<=-2).length,estables:r.filter(x=>x>-2&&x<2).length}}
function generarEstadoPlaza(d){const a={};for(const[g,keys]of Object.entries(GRUPOS))a[g]=analizarGrupo(d,keys);const activos=Object.values(a).filter(x=>x.prom!==null),promedio=activos.length?activos.reduce((s,x)=>s+x.prom,0)/activos.length:0;const firmes=Object.entries(a).filter(([g,x])=>x.prom>=1&&x.firmes>0).map(([g])=>g),bajas=Object.entries(a).filter(([g,x])=>x.prom<=-1&&x.bajas>0).map(([g])=>g),tranquilas=Object.entries(a).filter(([g,x])=>x.prom!==null&&Math.abs(x.prom)<1).map(([g])=>g);const nombres={novillos:'novillos',novillitos:'novillitos',vaquillonas:'vaquillonas',vacas:'vacas',toros:'toros'},lista=x=>x.map(g=>nombres[g]);let texto;if(promedio>=1.5)texto='La jornada muestra una plaza firme, con predominio de mejoras en las principales categorías.';else if(promedio<=-1.5)texto='La jornada presenta una plaza más floja y selectiva, con predominio de bajas en las principales categorías.';else texto='La jornada presenta un comportamiento mixto y selectivo, con diferencias según categoría y calidad.';if(firmes.length){const f=lista(firmes);texto+=f.length===1?` Se observa firmeza especialmente en ${f[0]}.`:` Se destacan por su firmeza ${f.slice(0,-1).join(', ')} y ${f[f.length-1]}.`}if(tranquilas.length){const t=lista(tranquilas);if(t.length===1)texto+=` ${t[0][0].toUpperCase()+t[0].slice(1)} se mantiene tranquila, con variaciones acotadas.`;else texto+=` ${t[0][0].toUpperCase()+t[0].slice(1)} y ${t[1]} se mantienen tranquilos, con variaciones acotadas.`}if(bajas.length){const b=lista(bajas);texto+=b.length===1?` En ${b[0]} aparecen algunas bajas en los valores máximos.`:` En ${b.join(' y ')} aparecen bajas puntuales en algunos máximos.`}const ic=Object.values(d.indices_changes||{}).filter(x=>typeof x==='number');if(ic.filter(x=>x<-1).length>=2)texto+=' Los índices de referencia también muestran una evolución negativa en la jornada.';else if(ic.filter(x=>x>1).length>=2)texto+=' Los índices de referencia acompañan con una evolución positiva.';return texto}
async function load(){try{const d=await fetch(MAG_JSON+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('MAG HTTP '+r.status);return r.json()});document.getElementById('fecha-mag').textContent=d.date||'Sin fecha';let html=`<div class="mag-header"><strong>MAG CAÑUELAS</strong><span>${d.date||''}</span><small>Fuente: Grupo Guarino</small></div><div class="mag-resumen"><strong>${Number(d.heads||0).toLocaleString('es-AR')}</strong><span>Entrada · cabezas</span></div><div class="mag-resumen"><strong>${d.trucks??'—'}</strong><span>Camiones</span></div>`;for(const k of Object.keys(C))if(d.prices?.[k])html+=dato(k,d);html+=indices(d);document.getElementById('mag-track').innerHTML=html+html;document.getElementById('estado-plaza-texto').textContent=generarEstadoPlaza(d)}catch(e){console.error(e);document.getElementById('fecha-mag').textContent='Sin datos';document.getElementById('estado-plaza-texto').textContent='No fue posible cargar los datos de la jornada.';document.getElementById('mag-track').innerHTML='<div style="padding:20px;font-family:Arial">No se pudieron cargar los datos MAG.</div>'}}
load();
</script>
</body>
</html>
