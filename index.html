<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acción Rural · Mercado Agroganadero MAG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f5;color:#18352a}.wrap{max-width:1100px;margin:auto;padding:28px 18px 45px}.head{background:#006837;color:white;border-radius:16px;padding:24px;margin-bottom:20px}.head h1{margin:0 0 8px;font-size:28px}.head p{margin:4px 0;opacity:.92}.meta{font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.07)}.card h2{font-size:16px;margin:0 0 12px}.price{font-size:27px;font-weight:700}.unit{font-size:13px;color:#667;margin-top:4px}.section{margin:25px 0 12px;font-size:21px}.table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8ece9}th{background:#e8f1ec}.right{text-align:right}.foot{margin-top:20px;font-size:13px;color:#68756e}.status{display:inline-block;background:#dff3e7;color:#17643f;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:bold}@media(max-width:600px){.head h1{font-size:23px}.price{font-size:23px}}
</style>
</head>
<body><main class="wrap"><header class="head"><h1>Acción Rural · Mercado Agroganadero</h1><p>Precios MAG Cañuelas</p><p class="meta" id="meta">Cargando datos…</p></header><div id="content"><p>Cargando precios…</p></div><div class="foot">Fuente: Guarino Producciones · Mercado Agroganadero de Cañuelas (MAG). Esta página se actualiza leyendo automáticamente el archivo de datos del repositorio.</div></main>
<script>
const labels={NOVILLOS:'Novillos',NOVILLITOS:'Novillitos',VAQUILLONAS:'Vaquillonas',VACAS:'Vacas',TOROS:'Toros'};
const catLabels={novillos_431_460:'Novillos 431/460',novillos_461_490:'Novillos 461/490',novillos_491_520:'Novillos 491/520',novillos_mas_520:'Novillos +520',novillos_regulares:'Novillos regulares',novillitos_300_350:'Novillitos 300/350',novillitos_351_390:'Novillitos 351/390',novillitos_391_430:'Novillitos 391/430',novillitos_regulares:'Novillitos regulares',vaquillonas_300_350:'Vaquillonas 300/350',vaquillonas_351_390:'Vaquillonas 351/390',vaquillonas_391_430:'Vaquillonas 391/430',vaquillonas_regulares:'Vaquillonas regulares',vacas_buenas_especiales:'Vacas buenas a especiales',vacas_regulares:'Vacas regulares',toros_buenos_especiales:'Toros buenos a especiales',toros_regulares:'Toros regulares'};
const money=n=>n==null?'—':new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(n);
async function load(){try{const r=await fetch('mag.json?x='+Date.now());const d=await r.json();document.getElementById('meta').innerHTML='<span class="status">ACTUALIZADO</span> &nbsp; '+d.date+' · '+d.heads.toLocaleString('es-AR')+' cabezas · '+d.label;let html='<h2 class="section">Valores por categoría</h2><table class="table"><thead><tr><th>Categoría</th><th class="right">Precio máximo ($/kg)</th></tr></thead><tbody>';for(const [k,v] of Object.entries(d.values)){html+=`<tr><td>${catLabels[k]||k}</td><td class="right"><strong>${money(v)}</strong></td></tr>`}html+='</tbody></table><h2 class="section">Promedios por grupo</h2><div class="grid">';for(const [k,v] of Object.entries(d.group_values)){html+=`<div class="card"><h2>${labels[k]||k}</h2><div class="price">$ ${money(v)}</div><div class="unit">promedio del grupo · $/kg</div></div>`}html+='</div><h2 class="section">Índices</h2><div class="grid">';for(const [k,v] of Object.entries(d.indices)){const names={inmag_novillo:'INMAG Novillo',igmag_general:'IGMAG General',arrendamiento:'Arrendamiento'};html+=`<div class="card"><h2>${names[k]||k}</h2><div class="price">${money(v)}</div><div class="unit">Variación: ${d.indices_changes?.[k]??'—'}%</div></div>`}html+='</div>';document.getElementById('content').innerHTML=html}catch(e){document.getElementById('content').innerHTML='<p>No se pudieron cargar los datos de MAG.</p>'}}load();
</script></body></html>
